<!DOCTYPE html>
<html lang="ms" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="/asrama-kptm/">
<title>Dashboard Warden - Sistem Asrama KPTM Bangi</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="warden.css">
</head>
<body>
<div class="top-bar"></div>
<div class="header-banner">
  <img class="banner-img" src="IMG_2610.jpeg" alt="KPTM Bangi">
  <div class="banner-overlay"></div>
  <div class="banner-content">
    <img class="banner-logo" src="IMG_2608.png" alt="Logo KPTM">
    <div class="banner-mid">
      <div class="banner-title">Dashboard Warden</div>
      <div class="banner-sub" id="who-name">Sistem Asrama KPTM Bangi</div>
    </div>
    <button class="icon-btn" id="logout">Log keluar</button>
  </div>
</div>
<div class="red-divider"></div>

<div class="wrap">
  <div class="stats">
    <div class="stat"><div class="n" id="c-pending">0</div><div class="l">Menunggu</div></div>
    <div class="stat"><div class="n" id="c-lulus">0</div><div class="l">Diluluskan</div></div>
    <div class="stat"><div class="n" id="c-tolak">0</div><div class="l">Ditolak</div></div>
  </div>

  <div class="tabs">
    <button class="tab active" data-f="pending">Menunggu</button>
    <button class="tab" data-f="lulus">Diluluskan</button>
    <button class="tab" data-f="tolak">Ditolak</button>
    <button class="tab" data-f="batal">Dibatalkan</button>
    <button class="tab" data-f="semua">Semua</button>
  </div>

  <div id="list"><div class="empty">Memuatkan...</div></div>
</div>

<div class="overlay" id="reject-overlay" hidden>
  <div class="dialog">
    <h3>Sebab tolak permohonan</h3>
    <textarea id="reject-reason" placeholder="Contoh: Tarikh bertindih dengan peperiksaan"></textarea>
    <div class="actions">
      <button class="act-btn cancel" id="reject-cancel">Batal</button>
      <button class="act-btn no" id="reject-confirm">Tolak Permohonan</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
const TYPE_LABEL = {balik_rumah:'Balik Rumah', bermalam_luar:'Bermalam Luar', keluar_sekejap:'Keluar Sekejap', kecemasan:'Kecemasan'};
const STATUS_LABEL = {pending:'Menunggu', lulus:'Diluluskan', tolak:'Ditolak', batal:'Dibatalkan', selesai:'Selesai'};
const fmt = d => new Date(d).toLocaleString('ms-MY', {day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit'});
const escapeHtml = s => (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let allRows = [];
let filter = 'pending';
let rejectTargetId = null;

async function boot() {
  const { data: { user } } = await sb.auth.getUser();
  if (!user) { location.href = 'index.html'; return; }
  const { data: profile } = await sb.from('profiles').select('role, full_name').eq('id', user.id).maybeSingle();
  if (!profile || profile.role !== 'warden') { location.href = 'index.html'; return; }
  $('who-name').textContent = profile.full_name || 'Dashboard Warden';
  await loadAll();
}

async function loadAll() {
  const { data, error } = await sb.from('warden_requests').select('*').order('created_at', { ascending: false });
  if (error) { $('list').innerHTML = '<div class="empty">Gagal memuat: ' + escapeHtml(error.message) + '</div>'; return; }
  allRows = data || [];
  updateStats();
  render();
}

function updateStats() {
  $('c-pending').textContent = allRows.filter(r => r.status === 'pending').length;
  $('c-lulus').textContent = allRows.filter(r => r.status === 'lulus').length;
  $('c-tolak').textContent = allRows.filter(r => r.status === 'tolak').length;
}

function render() {
  const rows = filter === 'semua' ? allRows : allRows.filter(r => r.status === filter);
  const box = $('list');
  if (rows.length === 0) { box.innerHTML = '<div class="empty">Tiada permohonan.</div>'; return; }
  box.innerHTML = rows.map(r => `
    <div class="req">
      <div class="req-top">
        <div>
          <div class="stu-name">${escapeHtml(r.full_name)}</div>
          <div class="stu-meta">${escapeHtml(r.matric_no)} · Blok ${escapeHtml(r.block || '-')} · Bilik ${escapeHtml(r.room_no || '-')}</div>
          <div class="stu-meta">📞 ${escapeHtml(r.parent_phone || '-')}</div>
        </div>
        <span class="badge ${r.status}">${STATUS_LABEL[r.status] || r.status}</span>
      </div>
      <div class="req-type">${TYPE_LABEL[r.type] || r.type}</div>
      <div class="req-dates">${fmt(r.depart_at)} &rarr; ${fmt(r.return_at)}</div>
      <div class="req-line"><b>Destinasi:</b> ${escapeHtml(r.destination)}</div>
      <div class="req-line"><b>Sebab:</b> ${escapeHtml(r.reason)}</div>
      ${r.status === 'tolak' && r.reject_reason ? `<div class="req-line" style="color:#991b1b"><b>Sebab tolak:</b> ${escapeHtml(r.reject_reason)}</div>` : ''}
      ${r.status === 'pending' ? `
        <div class="actions">
          <button class="act-btn ok" data-approve="${r.id}">Lulus</button>
          <button class="act-btn no" data-reject="${r.id}">Tolak</button>
        </div>` : ''}
    </div>
  `).join('');
  box.querySelectorAll('[data-approve]').forEach(b => b.onclick = () => decide(b.dataset.approve, 'lulus'));
  box.querySelectorAll('[data-reject]').forEach(b => b.onclick = () => openReject(b.dataset.reject));
}

document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  filter = t.dataset.f;
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x === t));
  render();
});

async function decide(id, status, reject_reason) {
  const payload = { status, decided_at: new Date().toISOString() };
  if (reject_reason !== undefined) payload.reject_reason = reject_reason;
  const { error } = await sb.from('requests').update(payload).eq('id', id);
  if (error) { alert('Gagal: ' + error.message); return; }
  await loadAll();
}

function openReject(id) { rejectTargetId = id; $('reject-reason').value = ''; $('reject-overlay').hidden = false; }
$('reject-cancel').onclick = () => { $('reject-overlay').hidden = true; rejectTargetId = null; };
$('reject-confirm').onclick = async () => {
  const reason = $('reject-reason').value.trim();
  if (!reason) { alert('Sila isi sebab tolak.'); return; }
  $('reject-overlay').hidden = true;
  await decide(rejectTargetId, 'tolak', reason);
  rejectTargetId = null;
};

$('logout').onclick = async () => { await sb.auth.signOut(); location.href = 'index.html'; };
boot();
</script>
</body>
</html>
